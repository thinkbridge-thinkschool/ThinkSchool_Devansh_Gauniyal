<section class="dev-login">
  <h2>Local dev login</h2>
  <p class="hint">For manually testing a real save against the local API. Not part of the graded exercise.</p>

  <form [formGroup]="form" (ngSubmit)="login()">
    <label>
      Email
      <input type="text" formControlName="email" autocomplete="username" />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    <div class="buttons">
      <button type="submit">Log in</button>
      <button type="button" (click)="logOut()">Log out</button>
    </div>
  </form>

  @if (status(); as message) {
    <p class="status">{{ message }}</p>
  }
  <p class="state">Token status: {{ loggedIn() ? 'stored' : 'none' }}</p>
</section>
