@if (!isAuthenticated()) {
  <div class="auth-gate">
    <app-dev-login (loginSucceeded)="isAuthenticated.set(true)" />
  </div>
} @else {
  <main>
    <div class="page-header">
      <h1 class="page-title">Quotes</h1>
      <app-dev-login (loggedOut)="isAuthenticated.set(false)" />
    </div>

    <section class="card card--primary">
      <h2 class="section-heading">Create a quote — reactive forms</h2>
      <app-create-quote-form (quoteCreated)="justCreated.set($event)" />
    </section>

    <section class="card card--primary">
      <h2 class="section-heading">Create a quote — Signal Forms (preview)</h2>
      <app-create-quote-form-signals (quoteCreated)="justCreated.set($event)" />
    </section>

    <section class="card">
      <app-quote-browser [justCreated]="justCreated()" />
    </section>
  </main>
}
