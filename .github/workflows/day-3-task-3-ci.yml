name: Day 3 Task 3 Auth Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - day-3/task-3

permissions:
  contents: read

jobs:
  auth-integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Restore Task 3
        run: dotnet restore day-3/task-3/Task3.slnx

      - name: Build Task 3
        run: dotnet build day-3/task-3/Task3.slnx --no-restore

      - name: Test Task 3
        run: dotnet test day-3/task-3/Task3.slnx --no-build --verbosity normal
